  }
  const schedule = () => { if (!frame) frame = requestAnimationFrame(paint); };
  // 확대 보기 같은 모달 <dialog> 는 top layer 에 뜬다. 바·핀·목록이 body 에 남아 있으면 그 뒤에 깔려
  // 누를 수 없다(2026-09-25 리뷰: 「자세히 보기 상태에서 위치바 누르면, 옮겨지면 좋을듯」).
  // 그래서 우리 것이 아닌 모달이 열리면 셋을 그 안으로 옮기고, 닫히면 body 로 돌려놓는다.
  const floating = () => [tools, list, pins];
  const hostDialog = () => Array.from(document.querySelectorAll('dialog[open]')).filter(d => !d.id.startsWith('pf-')).pop();
  function rehome() {
    const host = hostDialog() || document.body;
    for (const el of floating()) if (el.parentElement !== host) host.append(el);
    schedule();
  }
  new MutationObserver(rehome).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['open'] });
  function renderList() {
    $('pf-open').textContent = '피드백 ' + items.length;
    $('pf-undo-clear').hidden = !undoClear;
    const rows = $('pf-rows'); rows.replaceChildren();
    if (!items.length) { const empty = document.createElement('p'); empty.textContent = '등록된 의견이 없습니다.'; rows.append(empty); }
    items.forEach((item, index) => {
      if (filter.value !== 'all' && kindOf(item) !== filter.value && !(filter.value === 'fix' && kindOf(item) === 'mixed')) return;
      const row = document.createElement('div'); row.className = 'pf-row';
      const heading = document.createElement('strong'); heading.textContent = '#' + (index + 1) + ' ' + (item.title || item.target);
      const meta = document.createElement('small'); meta.textContent = kinds[kindOf(item)] + ' · ' + statuses[item.status] + ' · ' + locationText(item);
      const text = document.createElement('p'); text.textContent = item.text;
      const actions = document.createElement('div'); actions.className = 'pf-row-actions';
      const open = document.createElement('button'); open.className = 'pf-button'; open.textContent = '답글·수정 (' + (item.replies || []).length + ')'; open.onclick = () => edit(item);
      const jump = document.createElement('button'); jump.className = 'pf-button'; jump.textContent = isSectionItem(item) ? '섹션 보기' : '화면 보기'; jump.onclick = () => reveal(item);
      actions.append(jump, open); row.append(heading, meta, text);
      const review = reviewOf(item);
      if (review) { const response = document.createElement('p'); response.className = 'pf-review-response'; response.textContent = '처리 답변 · ' + review.result + '\n' + review.summary; row.append(response); }
      if (review?.href && /^(https?:\/\/|\.{1,2}\/)/.test(review.href)) { const link = document.createElement('a'); link.href = review.href; link.textContent = '변경 화면 보기'; row.append(link); }
      row.append(actions); rows.append(row);
    });
    renderSections();
  }
  // 섹션마다 버튼에 개수를, 제목 아래에 그 섹션 의견을 짧게 보여 준다 — 목록을 열지 않아도 그 자리에서 읽힌다.
  function renderSections() {
    document.querySelectorAll('[data-pf-section-btn]').forEach(button => {
      const key = button.dataset.pfSectionBtn;
      const count = items.filter(item => item.target === SECTION_PREFIX + key).length;
      button.textContent = count ? '코멘트 ' + count : '코멘트';
      button.setAttribute('aria-label', sectionTitle(key) + ' 섹션에 코멘트 남기기' + (count ? ' · 지금 ' + count + '개' : ''));
    });
    document.querySelectorAll('[data-pf-section-notes]').forEach(box => {
      const target = SECTION_PREFIX + box.dataset.pfSectionNotes;
      const mine = items.map((item, index) => ({ item, index })).filter(entry => entry.item.target === target);
      box.replaceChildren(); box.hidden = !mine.length;
      for (const { item, index } of mine) {
        const note = document.createElement('button'); note.type = 'button'; note.className = 'pf-section-note';
        const meta = document.createElement('small');
        meta.textContent = '#' + (index + 1) + ' · ' + kinds[kindOf(item)] + ' · ' + statuses[item.status] + (item.author ? ' · ' + item.author : '') + ((item.replies || []).length ? ' · 답글 ' + item.replies.length : '');
        const text = document.createElement('span'); text.textContent = item.text;
        note.append(meta, text);
        note.addEventListener('click', event => { event.preventDefault(); event.stopPropagation(); edit(item); });
        box.append(note);
      }
    });
  }
  function revealSection(item) {
    const el = sectionOf(item.target.slice(SECTION_PREFIX.length));
    if (!el) { say('현재 문서에서 해당 섹션을 찾지 못했습니다: ' + (item.title || item.target)); return; }
    // 여정·유즈케이스 칸이면 그 탭을 먼저 연다. 펼침 상자면 펼친다.
    const panelId = el.dataset.journeyPanel || el.dataset.useCasePanel;
    if (el.hidden && panelId) document.querySelector('[data-use-case-btn="' + CSS.escape(panelId) + '"]')?.click();
    const box = el.closest('details'); if (box && !box.open) box.open = true;
    list.hidden = true; el.scrollIntoView({ block: 'start' });
  }
  function reveal(item) {
    if (isSectionItem(item)) { revealSection(item); return; }
    const d = descriptors().find(d => d.target === item.target && d.journey === item.journey) || descriptors().find(d => d.target === item.target);
    if (!d) { say('현재 문서에서 해당 화면을 찾지 못했습니다. 원본 화면 ID: ' + item.target); return; }
    if (d.journey.startsWith('view-')) document.querySelector('[data-view="' + CSS.escape(d.journey.slice(5)) + '"]')?.click();
    else if (d.journey) document.querySelector('[data-journey-btn="' + CSS.escape(d.journey) + '"]')?.click();
    list.hidden = true; d.el.scrollIntoView({ block: 'center', inline: 'center' });
    showPins = true; $('pf-show').setAttribute('aria-pressed', 'true'); schedule();
  }
  function edit(item) {
    activeId = items.some(entry => entry.id === item.id) ? item.id : null; draft = item;
    $('pf-context').textContent = (item.title || item.target) + ' · ' + locationText(item) + (item.journey ? ' · ' + item.journey : '');
    $('pf-author').value = item.author || ''; $('pf-text').value = item.text || ''; $('pf-state').value = item.status || 'open'; $('pf-reply').value = ''; $('pf-editor-status').textContent = '';
    $('pf-kind').value = kindOf(item);
    const review = reviewOf(item);
    $('pf-review').textContent = review ? '처리 답변 · ' + review.result + '\n' + review.summary + (review.evidence ? '\n근거: ' + review.evidence : '') : '';
    $('pf-delete').hidden = !activeId;
    $('pf-text').placeholder = isSectionItem(item) ? '이 섹션 전체에 대한 의견 — 빠진 것, 고칠 것, 궁금한 점을 적어주세요.' : '이 위치에서 궁금한 점 또는 고칠 내용을 적어주세요.';
    $('pf-replies').replaceChildren();
    for (const reply of item.replies || []) { const li = document.createElement('li'); li.textContent = (reply.author || '답변자') + ' · ' + reply.createdAt + '\n' + reply.text; $('pf-replies').append(li); }
    editor.showModal(); $('pf-text').focus();
  }
  document.addEventListener('click', event => {
    if (!armed || event.target.closest('#pf-tools,#pf-list,#pf-editor,#pf-export,#pf-pins')) return;
    const d = descriptors().find(d => d.el === event.target || d.el.contains(event.target)); if (!d) return;
    const rect = d.el.getBoundingClientRect();
    event.preventDefault(); event.stopImmediatePropagation();
    const ratio = (n, size) => Math.max(0, Math.min(100, Math.round(n / size * 1000) / 10));
    edit({ id: uid(), target: d.target, title: d.title, journey: d.journey, route: d.route, x: ratio(event.clientX - rect.left, rect.width), y: ratio(event.clientY - rect.top, rect.height), text: '', status: 'open', replies: [], createdAt: new Date().toISOString() });
  }, true);
  // 모달에서 Cmd(맥)·Ctrl + Enter 로 바로 저장 — 손을 마우스로 옮기지 않게.
  editor.addEventListener('keydown', event => {
    if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) { event.preventDefault(); $('pf-save').click(); }
  });
  $('pf-save').onclick = () => {
    const text = $('pf-text').value.trim(); if (!text) { $('pf-editor-status').textContent = '의견을 입력해 주세요.'; return; }
    undoClear = null;
    const author = $('pf-author').value.trim() || '리뷰어';
    const item = { ...draft, text, kind: $('pf-kind').value, author: activeId ? draft.author : author, status: $('pf-state').value, updatedAt: new Date().toISOString(), replies: [...(draft.replies || [])] };
    const reply = $('pf-reply').value.trim(); if (reply) item.replies.push({ id: uid(), author, text: reply, createdAt: item.updatedAt });
    if (activeId) items = items.map(entry => entry.id === activeId ? item : entry); else items.push(item);
    persist(); renderList(); schedule(); editor.close();
  };
  // 모달에서 바로 — 목록 화면으로 옮겨 가지 않고 복사하고, 잘못 적었으면 입력만 비운다.
  $('pf-copy-here').onclick = event => { event.preventDefault(); $('pf-copy').click(); };
  $('pf-reset-here').onclick = event => {
    event.preventDefault();
    $('pf-text').value = ''; $('pf-reply').value = ''; $('pf-state').value = 'open';
    $('pf-editor-status').textContent = '입력을 비웠습니다. 저장한 의견은 그대로입니다.';
    $('pf-text').focus();
  };
  $('pf-delete').onclick = () => {
    if (!activeId || !confirm('이 의견과 답글을 삭제할까요?')) return;
    undoClear = null;
    removed.push(activeId); items = items.filter(item => item.id !== activeId); persist(); renderList(); schedule(); editor.close();
  };
  // 섹션 버튼 — summary 안에 있으면 누를 때 상자가 접히지 않게 기본 동작을 막는다.
  document.querySelectorAll('[data-pf-section-btn]').forEach(button => {
    button.hidden = false;
    button.addEventListener('click', event => {
      event.preventDefault(); event.stopPropagation();
      const key = button.dataset.pfSectionBtn;
      edit({ id: uid(), target: SECTION_PREFIX + key, title: sectionTitle(key), journey: '', route: '', x: null, y: null, text: '', status: 'open', replies: [], createdAt: new Date().toISOString() });
    });
  });
  $('pf-mode').onclick = () => { armed = !armed; document.body.classList.toggle('pf-armed', armed); $('pf-mode').setAttribute('aria-pressed', String(armed)); if (armed) { list.hidden = true; showPins = true; $('pf-show').setAttribute('aria-pressed', 'true'); } say(armed ? '화면 또는 도식의 원하는 위치를 클릭하세요. Esc: 위치 모드 종료' : '일반 보기 · 화면을 클릭하면 기존 동작을 수행합니다.'); schedule(); };
  $('pf-show').onclick = () => { showPins = !showPins; $('pf-show').setAttribute('aria-pressed', String(showPins)); schedule(); };
  $('pf-open').onclick = () => { list.hidden = !list.hidden; renderList(); };
  $('pf-close').onclick = () => { list.hidden = true; };
  filter.onchange = renderList;
  const legacyNotes = () => Array.from(document.querySelectorAll('[data-comment]'));
  function setNotes(notes) {
    for (const { id, text } of notes) {
      const input = legacyNotes().find(input => input.dataset.comment === id);
      if (!input) continue;
      input.value = text;
      input.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }
  $('pf-clear-all').onclick = () => {
    const notes = legacyNotes().map(input => ({ id: input.dataset.comment, text: input.value }));
    const count = notes.filter(note => note.text.trim()).length;
    if (!items.length && !count) { $('pf-list-status').textContent = '삭제할 의견이 없습니다.'; return; }
    if (storageBroken) { $('pf-list-status').textContent = '저장소를 읽지 못해 삭제하지 않았습니다. 먼저 JSON을 내보내 주세요.'; return; }
    const replies = items.reduce((sum, item) => sum + (item.replies || []).length, 0);
    if (!confirm('이 리포트의 의견 ' + items.length + '개(핀 포함), 답글 ' + replies + '개, 단계 메모 ' + count + '개를 모두 삭제할까요?\n다른 리포트와 제품 데이터는 삭제하지 않습니다. 필요하면 먼저 JSON을 내보내 주세요.')) return;
    const backup = { items, removed, notes };
    removed = [...new Set([...removed, ...items.map(item => item.id), ...config.seed.map(item => item.id)])];
    items = [];
    if (!persist()) { items = backup.items; removed = backup.removed; $('pf-list-status').textContent = '저장 실패로 삭제를 취소했습니다.'; return; }
    undoClear = backup;
    setNotes(notes.map(note => ({ ...note, text: '' })));
    renderList(); schedule();
    $('pf-list-status').textContent = '전체 삭제했습니다. 새로고침하거나 새 의견을 저장하기 전까지 되돌릴 수 있습니다.';
  };
  $('pf-undo-clear').onclick = () => {
    if (!undoClear) return;
    const current = { items, removed };
    items = undoClear.items; removed = undoClear.removed;
    if (!persist()) { items = current.items; removed = current.removed; $('pf-list-status').textContent = '저장 실패로 복원하지 못했습니다.'; return; }
    setNotes(undoClear.notes); undoClear = null; renderList(); schedule();
    $('pf-list-status').textContent = '전체 삭제 전 의견·답글·단계 메모를 복원했습니다.';
  };
  function packet() {
    return { version: 1, reportId: config.id, title: config.title, exportedAt: new Date().toISOString(), items: items.map(item => ({ ...item, kind: kindOf(item), review: reviewOf(item) })), removed, generalComments: Array.from(document.querySelectorAll('article.step')).map(card => ({ screenId: card.dataset.stepId, journey: card.closest('[data-journey-panel]')?.dataset.journeyPanel || '', title: card.dataset.title, text: card.querySelector('[data-comment]')?.value || '' })).filter(item => item.text.trim()) };
  }
  $('pf-json').onclick = () => {
    const url = URL.createObjectURL(new Blob([JSON.stringify(packet(), null, 2)], { type: 'application/json' }));
    const link = document.createElement('a'); link.href = url; link.download = 'flow-feedback.json'; link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  $('pf-copy').onclick = async () => {
    const data = packet();
    const text = '# ' + config.title + '\n' + data.items.map((item, index) => '\n■ ' + (index + 1) + '. ' + (item.title || item.target) + '\n' + (isSectionItem(item) ? '섹션: ' + (item.title || item.target) : '화면 ID: ' + item.target + ' · 여정: ' + (item.journey || '공통')) + '\n' + kinds[item.kind] + ' · ' + locationText(item) + ' · ' + statuses[item.status] + '\n' + item.text + (item.review ? '\n처리 답변 · ' + item.review.result + '\n' + item.review.summary : '') + (item.replies || []).map(reply => '\n↳ ' + reply.author + ': ' + reply.text).join('')).join('\n') + data.generalComments.map(item => '\n■ ' + item.title + '\n' + item.text).join('\n');
    try { await navigator.clipboard.writeText(text); say('복사됐습니다. 대화창에 붙여넣어 주세요.'); }
    catch (_) { exportDialog.querySelector('textarea').value = text; exportDialog.showModal(); exportDialog.querySelector('textarea').select(); }
  };
  // Existing report copy control must include point comments and replies, too.
  document.getElementById('copy-all')?.addEventListener('click', event => { event.stopImmediatePropagation(); $('pf-copy').click(); }, true);
  const legacyClear = document.getElementById('clear-all');
  if (legacyClear) legacyClear.textContent = '단계 메모만 지우기';
  document.addEventListener('keydown', event => { if (event.key === 'Escape' && !editor.open && armed) $('pf-mode').click(); });
  document.addEventListener('scroll', schedule, true); window.addEventListener('resize', schedule); window.addEventListener('load', schedule);
  new MutationObserver(records => { if (records.some(record => !record.target.closest?.('#pf-tools,#pf-list,#pf-editor,#pf-export,#pf-pins'))) schedule(); }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'class', 'data-feedback-target'] });
  window.addEventListener('storage', event => {
    if (event.key !== key || editor.open) return;
    try { const next = normalize(JSON.parse(event.newValue)); items = next.items; removed = next.removed || []; undoClear = null; renderList(); schedule(); } catch (_) { say('다른 창의 저장 내용을 읽지 못했습니다. 현재 내용을 내보내 주세요.'); }
  });
  renderList(); if (storageBroken) say('저장소를 읽지 못했습니다. 기존 저장값은 보존하며 JSON 내보내기를 사용하세요.');
})();
</script>
<!-- point-feedback:end -->
</body>
</html>
